<VirtualHost *:80>
	ServerName jukebox.test
	ServerAlias localhost

	DocumentRoot /var/www/html

	<Directory /var/www/html>
		Options -Indexes
		AllowOverride All
		Require all granted
	</Directory>

	ErrorLog ${APACHE_LOG_DIR}/jukebox-error.log
	CustomLog ${APACHE_LOG_DIR}/jukebox-access.log combined
</VirtualHost>